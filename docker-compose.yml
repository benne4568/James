# James auf einem eigenen Rechner (Docker).
# Start:  cp .env.example .env  (ausfüllen)  &&  docker compose up -d --build
services:
  james:
    build: ./james_app
    container_name: james
    restart: unless-stopped
    env_file: .env
    environment:
      JAMES_DATA_DIR: /data
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ports:
      - "8099:8099"
