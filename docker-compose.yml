# Klausi auf einem eigenen Rechner (Docker).
# Start:  cp .env.example .env  (ausfüllen)  &&  docker compose up -d --build
services:
  klausi:
    build: ./klausi_app
    container_name: klausi
    restart: unless-stopped
    env_file: .env
    environment:
      KLAUSI_DATA_DIR: /data
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ports:
      - "8099:8099"
