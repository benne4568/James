name: Klausi
version: "0.1.1"
slug: klausi
description: Claude als zentraler Hausassistent (steuert und konfiguriert Home Assistant)
url: https://github.com/benne4568/James
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  8099/tcp: null
options:
  anthropic_api_key: ""
  api_token: ""
  model: claude-opus-5-5
  effort: low
  assistant_name: Klausi
  owner_name: Benedikt
  web_search: true
  history_turns: 20
  mcp_servers:
    - name: bat
      url: ""
      description: "Hauptwohnung Bat Cave"
  extra_sensitive_patterns: []
schema:
  anthropic_api_key: password
  api_token: password
  model: str
  effort: list(low|medium|high|xhigh|max)
  assistant_name: str
  owner_name: str
  web_search: bool
  history_turns: int(4,100)
  mcp_servers:
    - name: match(^[a-z0-9]{1,12}$)
      url: url
      description: str?
  extra_sensitive_patterns:
    - str
